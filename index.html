<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clubs ENS Marrakech</title>
<link rel="icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF8F3;--card:#fff;--ink:#1D2B3A;--mut:#5C6876;--line:#E4DFD3;--blue:#0B66BE;--tint:#E6F1FB;--ochre:#C58033;--sage:#6E9B7C;--terra:#E8825A;--brown:#8B4F33;--on:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1720;--card:#18232F;--ink:#EEF2F6;--mut:#9AA8B6;--line:#2A3846;--blue:#5AA9F0;--tint:#16314A;--ochre:#DDA05A;--sage:#8DBB9B;--terra:#F29A78;--brown:#C48764;--on:#0B1520;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1720;--card:#18232F;--ink:#EEF2F6;--mut:#9AA8B6;--line:#2A3846;--blue:#5AA9F0;--tint:#16314A;--ochre:#DDA05A;--sage:#8DBB9B;--terra:#F29A78;--brown:#C48764;--on:#0B1520;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif;-webkit-text-size-adjust:100%}
h2,h3,.av,.dt{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif}
h2{font-size:28px;line-height:1.1;margin:18px 0 6px;font-weight:800}h3{font-size:19px;margin:22px 0 8px;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
main{max-width:720px;margin:0 auto;padding:0 16px 100px}
.top{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:14px 16px 0}
.top img{width:64px;height:64px;border-radius:16px}.top b{font:800 20px "Bricolage Grotesque",sans-serif;display:block}.top span,.mut{color:var(--mut)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs button{flex:1;background:none;border:0;padding:10px 4px 9px;display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--mut)}
.tabs button[aria-selected=true]{color:var(--blue)}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.flt{display:flex;gap:8px;margin:14px 0}.flt button{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;font-weight:600}
.flt button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:var(--on)}
.card{display:block;width:100%;text-align:left;padding:0;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin:0 0 16px}
.ph{aspect-ratio:16/9;background:var(--c);display:grid;place-items:center;position:relative;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;object-position:center top}
.ph i{width:34%;aspect-ratio:1;border:4px solid rgba(255,255,255,.6);border-radius:18%;transform:rotate(45deg)}
.dt{position:absolute;left:12px;top:12px;background:var(--card);border-radius:12px;padding:5px 11px;text-align:center;font-size:20px;line-height:1.05;font-weight:800}
.dt small{display:block;font-size:12px;font-weight:600;color:var(--mut)}
.cb{padding:12px 16px 14px}.cb h3{margin:0 0 2px}.cb p{margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px}
.chip{display:inline-block;border:1.5px solid var(--k,var(--line));border-radius:99px;padding:1px 10px;font-size:13px;font-weight:600}
.k-m{--k:var(--ochre)}.k-s{--k:var(--blue)}.k-f{--k:var(--sage)}
.need{border-left:4px solid var(--k);padding:2px 0 2px 12px;margin:10px 0}
.prop{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.pre{white-space:pre-wrap;overflow-wrap:anywhere}
.av{width:48px;height:48px;flex:none;border-radius:14px;background:var(--c);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:800;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}.av.lg{width:88px;height:88px;border-radius:24px;font-size:36px}.hd .av{width:36px;height:36px;font-size:16px;border-radius:10px}
.row{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin:0 0 10px}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:10;overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:up .22s ease-out}
.sheet>div{max-width:720px;margin:0 auto;padding:6px 16px 48px}
@keyframes up{from{transform:translateY(24px);opacity:0}}@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.back{display:flex;align-items:center;gap:4px;background:none;border:0;padding:10px 0;font-weight:600;color:var(--blue)}
.link{background:none;border:0;padding:0;color:var(--blue);font-weight:600;text-decoration:underline}
.pst{display:block;max-width:100%;max-height:70vh;margin:8px auto 16px;border-radius:16px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:16px 0}.dl dt{color:var(--mut)}.dl dd{margin:0;overflow-wrap:anywhere}.dl a{color:var(--blue);font-weight:600}
.btn{background:var(--blue);color:var(--on);border:0;border-radius:12px;padding:12px 20px;font-weight:700;margin-top:16px}.btn:disabled{opacity:.6}.wide{width:100%;margin-top:20px}
.empty{display:grid;gap:12px;justify-items:center;text-align:center;color:var(--mut);padding:28px 16px;border:1.5px dashed var(--line);border-radius:20px;margin:12px 0}.empty .btn{margin:0}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:4px 16px 18px;margin:18px 0}
.f label{display:block;font-weight:600;font-size:14px;margin:14px 0 4px}
.f input:not([type=radio]),.f select,.f textarea,.q{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.q{margin:12px 0 14px}
.segs{display:flex;gap:8px;flex-wrap:wrap}.f .seg{display:inline-block;margin:0;position:relative;border:1.5px solid var(--line);border-radius:99px;padding:6px 14px}
.seg input{position:absolute;opacity:0;inset:0}.seg:has(input:checked){background:var(--blue);border-color:var(--blue);color:var(--on)}.seg:has(:focus-visible){outline:3px solid var(--blue);outline-offset:2px}
#toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;z-index:20;transition:opacity .2s;max-width:90%;text-align:center}#toast.on{opacity:1}
.ft{text-align:center;color:var(--mut);font-size:14px;margin:32px 0 8px}.ft a{color:var(--blue);font-weight:600}
[hidden]{display:none!important}
</style></head>

function evCard(v){const c=club(v.clubId),n=props(v.id).length;return `<button class="card" data-ev="${v.id}"><div class="ph" style="--c:var(${col(v.clubId)})">${IMG(v.poster)?`<img src="${v.poster}" alt="">`:"<i></i>"}<span class="dt">${fmt(v.date,{day:"numeric"})}<small>${fmt(v.date,{month:"short"})}</small></span></div><div class="cb"><h3>${E(v.name)}</h3><p class="mut">${E(short(c))}</p><div class="chips">${needs(v).map(chip).join("")}${n?`<span class="mut">${n} proposition${n>1?"s":""}</span>`:""}</div></div></button>`}
function evsScreen(){const t=today(),all=S.events.filter(v=>v.name&&v.date),up=all.filter(v=>v.date>=t).sort((a,b)=>a.date.localeCompare(b.date)),pa=all.filter(v=>v.date<t).sort((a,b)=>b.date.localeCompare(a.date)),L=S.filter==="up"?up:pa;
return `<h2>Actualités</h2><p class="mut">Les événements des clubs et l’aide dont ils ont besoin.</p><div class="flt"><button data-f="up" aria-pressed="${S.filter==="up"}">À venir (${up.length})</button><button data-f="past" aria-pressed="${S.filter==="past"}">Passés (${pa.length})</button></div>${L.length?L.map(evCard).join(""):`<div class="empty">${S.filter==="up"?"Aucun événement à venir pour le moment.":"Aucun événement passé."}<button class="btn" data-tab="me">Publier un événement</button></div>`}`}
function dirList(){const q=S.q.toLowerCase(),L=S.clubs.filter(c=>c.name&&(c.name+" "+(c.president||"")).toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name,"fr"));
return L.length?L.map(c=>`<button class="row" data-club="${c.id}">${av(c)}<span><b>${E(short(c))}</b><br><small class="mut">${E(c.president||"Président à renseigner")}</small></span></button>`).join(""):`<div class="empty">${S.q?"Aucun club ne correspond à cette recherche.":"Aucun club pour le moment."}</div>`}
const dirScreen=()=>`<h2>Annuaire des clubs</h2><p class="mut">Retrouve les présidents et contacte-les directement.</p><input id="q" class="q" type="search" placeholder="Rechercher un club ou un président" value="${E(S.q)}" aria-label="Rechercher un club"><div id="dl">${dirList()}</div>`;

function clubSheet(c){const ev=S.events.filter(v=>v.clubId===c.id&&v.date).sort((a,b)=>b.date.localeCompare(a.date)),ph=String(c.phone||"").replace(/[^\d+]/g,""),w=URLX(c.website),s=URLX(c.social),em=/^[^\s@<>"]+@[^\s@<>"]+$/.test(c.email||"")?c.email:"";
const r=[["Président",c.president&&E(c.president)],["Téléphone",ph&&`<a href="tel:${ph}">${E(c.phone)}</a>`],["Email",em&&`<a href="mailto:${E(em)}">${E(em)}</a>`],["Site web",w&&`<a href="${E(w)}" target="_blank" rel="noopener noreferrer">${E(w.replace(/^https?:\/\//,""))}</a>`],["Réseaux sociaux",s&&`<a href="${E(s)}" target="_blank" rel="noopener noreferrer">${E(s.replace(/^https?:\/\/(www\.)?/,""))}</a>`]].filter(x=>x[1]);
return `<button class="back" data-back>${I('<path d="M15 5l-7 7 7 7"/>')}Retour</button><div class="hd">${av(c,1)}</div><h2>${E(short(c))}</h2>${r.length?`<dl class="dl">${r.map(x=>`<dt>${x[0]}</dt><dd>${x[1]}</dd>`).join("")}</dl>`:`<p class="mut">Ce club n’a pas encore complété son profil.</p>`}<h3>Événements du club</h3>${ev.length?ev.map(evCard).join(""):`<p class="mut">Aucun événement publié.</p>`}`}
function helpBlock(v){const m=mine();
if(!S.me||!m)return `<div class="empty">${S.me?"Pour proposer ton aide, associe d’abord ton club à ton compte.":"Tu es président d’un club ? Connecte-toi pour proposer ton aide."}<button class="btn" data-tab="me">Aller dans Mon espace</button></div>`;
if(!S.help)return `<button class="btn wide" data-help>Proposer de l’aide</button>`;
return `<form class="f box" data-form="help"><h3>Proposer de l’aide</h3><p class="mut">Club aidant : <b>${E(short(m))}</b></p><div class="segs" role="group" aria-label="Catégorie d’aide">${NEED.map(n=>`<label class="seg"><input type="radio" name="cat" value="${n[1]}">${n[1]}</label>`).join("")}</div><label for="hm">Ton message</label><textarea id="hm" rows="4" required placeholder="Ex. : nous pouvons prêter 2 vidéoprojecteurs et 4 bénévoles."></textarea><button class="btn">Envoyer ma proposition</button></form>`}
function evSheet(v){const c=club(v.clubId),ps=props(v.id),m=mine(),ns=needs(v);
return `<button class="back" data-back>${I('<path d="M15 5l-7 7 7 7"/>')}Retour</button>${IMG(v.poster)?`<img class="pst" src="${v.poster}" alt="Affiche : ${E(v.name)}">`:`<div class="ph" style="--c:var(${col(v.clubId)});border-radius:18px;margin:8px 0 16px"><i></i></div>`}<h2>${E(v.name)}</h2><p class="mut">${fmt(v.date,{weekday:"long",day:"numeric",month:"long",year:"numeric"})}<br>Organisé par ${c?`<button class="link" data-club="${c.id}">${E(short(c))}</button>`:"un club"}</p><p class="pre">${E(v.description)}</p>${S.me?`<h3>Aides demandées</h3>${ns.length?ns.map(n=>`<div class="need k-${n[0]}"><b>${n[1]}</b><div class="pre">${E(nd(v)[n[2]])}</div></div>`).join(""):`<p class="mut">Aucune aide demandée pour le moment.</p>`}`:""}${S.me?`<h3>Propositions d’aide (${ps.length})</h3>${ps.length?ps.map(p=>{const h=club(p.clubId);return `<div class="prop"><div class="hd">${av(h)}<b>${E(short(h))}</b><span class="chip k-${CAT[p.category]||"m"}">${E(p.category)}</span></div><div class="pre">${E(p.message)}</div></div>`}).join(""):`<p class="mut">Aucune proposition pour l’instant.</p>`}`:""}${m&&m.id===v.clubId?`<p class="mut">C’est l’événement de ton club.</p>`:helpBlock(v)}`}

function meScreen(){const h="<h2>Mon espace</h2>";
if(!S.me)return loginScreen();
const c=mine(),out=`<p><button class="link" data-out>Se déconnecter</button></p>`,seed=S.clubs.length?"":`<div class="empty">L’annuaire est vide.<button class="btn" data-seed>Ajouter les ${SEED.length} clubs de l’ENS</button></div>`;
if(!c)return h+seed+`<p class="mut">Associe ton compte au club que tu présides pour publier des événements et proposer ton aide.</p><form class="f" data-form="claim"><label for="cl">Mon club</label><select id="cl" required><option value="">Choisir mon club</option>${S.clubs.filter(x=>!x.ownerId&&x.name).sort((a,b)=>a.name.localeCompare(b.name,"fr")).map(x=>`<option value="${x.id}">${E(short(x))}</option>`).join("")}<option value="__new">Mon club n’est pas dans la liste</option></select><div id="nw" hidden><label for="nn">Nom du club</label><input id="nn"></div><button class="btn">Je préside ce club</button></form>${out}`;
const L=S.events.filter(v=>v.clubId===c.id).sort((a,b)=>(b.date||"").localeCompare(a.date||"")),t=(id,l,x="",ph="")=>`<label for="${id}">${l}</label><textarea id="${id}" rows="2" placeholder="${ph}">${x}</textarea>`,i=(id,l,x,ty="text")=>`<label for="${id}">${l}</label><input id="${id}" type="${ty}" value="${E(x||"")}">`;
return h+`<p class="mut">Espace du club ${E(short(c))}</p>
<section class="box"><h3>Nouvel événement</h3><form class="f" data-form="event"><label for="en">Nom de l’événement</label><input id="en" required><label for="ed">Date prévue</label><input id="ed" type="date" required min="${today()}"><label for="ep">Affiche</label><input id="ep" type="file" accept="image/*"><label for="ex">Description</label><textarea id="ex" rows="4" required></textarea><p class="mut">Précise l’aide dont tu as besoin (visible uniquement des présidents connectés). Laisse vide ce qui ne te concerne pas.</p>${t("n1","Besoins matériels","","Ex. : 10 tables, sono, vidéoprojecteur")}${t("n2","Besoins en staff","","Ex. : 6 bénévoles pour l’accueil")}${t("n3","Besoins financiers","","Ex. : 1 500 MAD pour les impressions")}<button class="btn">Publier l’événement</button></form></section>
<section class="box"><h3>Mes événements</h3>${L.length?L.map(v=>`<div class="row"><span style="flex:1"><b>${E(v.name)}</b><br><small class="mut">${v.date?fmt(v.date,{day:"numeric",month:"long",year:"numeric"}):""}, ${props(v.id).length} proposition(s)</small></span><button class="link" data-ev="${v.id}">Voir</button><button class="link" data-del="${v.id}">${S.cdel===v.id?"Confirmer":"Supprimer"}</button></div>`).join(""):`<p class="mut">Tu n’as pas encore publié d’événement.</p>`}</section>
<details class="box" ${c.president?"":"open"}><summary><h3 style="display:inline">Profil du club</h3></summary><form class="f" data-form="profile"><label for="pl">Logo</label><input id="pl" type="file" accept="image/*">${i("pp","Nom du président",c.president)}${i("pe","Email du président",c.email,"email")}${i("pt","Numéro de téléphone",c.phone,"tel")}${i("pw","Site web",c.website)}${i("ps","Lien réseaux sociaux",c.social)}<button class="btn">Enregistrer le profil</button></form></details>${out}`}

const FOOT=`<footer class="ft">Site conçu par <a href="https://tajerramtmoussabe.my.canva.site/" target="_blank" rel="noopener noreferrer">Moussabe Tajerramt</a></footer>`;
function render(){
if(!S.ready){$("#app").innerHTML=`<p class="empty">Chargement…</p>`;return}
document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===S.tab));
$("#app").innerHTML=(S.err?`<p class="empty">Impossible de charger les données. Recharge la page.</p>`:"")+({events:evsScreen,dir:dirScreen,me:meScreen})[S.tab]()+FOOT;
const z=S.sheet,c=z&&(z.t==="ev"?S.events.find(v=>v.id===z.id):club(z.id));if(z&&!c)S.sheet=null;
$("#sh").hidden=!c;document.body.style.overflow=c?"hidden":"";if(c)$("#shc").innerHTML=(z.t==="ev"?evSheet(c):clubSheet(c))+FOOT}
const typing=()=>{const a=document.activeElement;return a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)};
const paint=()=>{if(typing()){S.dirty=1;return}render()};
const open=(t,id)=>{S.sheet={t,id};S.help=false;render();$("#sh").scrollTop=0};
document.addEventListener("focusout",()=>setTimeout(()=>{if(S.dirty&&!typing()){S.dirty=0;render()}},60));
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.sheet){S.sheet=null;render()}});
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;$("#dl").innerHTML=dirList()}});
document.addEventListener("change",e=>{if(e.target.id==="cl")$("#nw").hidden=e.target.value!=="__new"});
document.addEventListener("click",async e=>{const b=e.target.closest("[data-tab],[data-ev],[data-club],[data-back],[data-f],[data-help],[data-del],[data-out],[data-seed],[data-signup],[data-reset]");if(!b)return;const d=b.dataset;
if(d.out!==undefined)signOut(auth);else if(d.seed!==undefined)seedClubs();else if(d.signup!==undefined||d.reset!==undefined)authAction(d.reset!==undefined);else if(d.tab){S.tab=d.tab;S.sheet=null;render();scrollTo(0,0)}else if(d.ev)open("ev",d.ev);else if(d.club)open("club",d.club);else if(d.back!==undefined){S.sheet=null;render()}else if(d.f){S.filter=d.f;render()}else if(d.help!==undefined){S.help=true;render()}
else if(d.del){if(S.cdel!==d.del){S.cdel=d.del;render();return}S.cdel=null;try{await S.db.collection("needs").doc(d.del).delete().catch(()=>{});await S.db.collection("events").doc(d.del).delete();toast("Événement supprimé")}catch{toast("Suppression impossible.")}}});
document.addEventListener("submit",async e=>{e.preventDefault();const f=e.target,k=f.dataset.form,b=f.querySelector("button"),v=id=>(f.querySelector("#"+id)?.value||"").trim(),m=mine(),C=n=>S.db.collection(n);b.disabled=true;
try{
if(k==="login"){await signInWithEmailAndPassword(auth,v("em"),f.querySelector("#pw").value)}else if(k==="claim"){const s=v("cl");if(s==="__new"){const n=v("nn");if(!n)throw"Indique le nom du club.";await C("clubs").add({name:n,ownerId:S.me})}else{if(club(s)?.ownerId)throw"Ce club est déjà associé à un autre compte.";await C("clubs").doc(s).update({ownerId:S.me})}toast("Club associé à ton compte")}
else if(k==="event"){const d={name:v("en"),date:v("ed"),description:v("ex"),clubId:m.id,at:Date.now()},p=f.querySelector("#ep").files[0];if(p)d.poster=await shrink(p,800);const r=await C("events").add(d);await C("needs").doc(r.id).set({clubId:m.id,needsMat:v("n1"),needsStaff:v("n2"),needsFin:v("n3")});S.tab="events";S.filter="up";toast("Événement publié")}
else if(k==="profile"){const d={president:v("pp"),email:v("pe"),phone:v("pt"),website:v("pw"),social:v("ps")},p=f.querySelector("#pl").files[0];if(p)d.logo=await shrink(p,240);await C("clubs").doc(m.id).update(d);toast("Profil enregistré")}
else if(k==="help"){const cat=f.querySelector("input:checked")?.value;if(!cat)throw"Choisis une catégorie d’aide.";await C("proposals").add({clubId:m.id,eventId:S.sheet.id,category:cat,message:v("hm"),at:Date.now()});S.help=false;toast("Proposition envoyée")}
}catch(x){toast(typeof x==="string"?x:AUTH_ERR[x.code]||"Action impossible. Vérifie ta connexion et réessaie.")}
b.disabled=false;S.dirty=0;render()});
const SEED=["Club BRIDGE - ENS", "Club ENACTUS - ENS", "Club INTELLIGENCE ARTIFICIELLE - ENS", "Club de l'ENSEIGNEMENT INCLUSIF ET DE LA RESPONSABILITÉ SOCIALE - ENS", "Club E-TEAM - ENS", "Club AGORA - ENS", "Club d'ÉCHECS - ENS", "Club EDUCATION à LA SANTÉ ET L'ENVIRONNEMENT - ENS", "Club DES AMIS DE L'ECOLE PUBLIQUE - ENS", "Club EMPOWERMENT EDUCATION - ENS", "Club VIRIDIS'U - ENS", "Club TUTORAT - ENS", "Club Entrepreneuriat - ENS", "Club Thespian - ENS", "Club “صدى الادب” -ENS", "Club Digital Craft - ENS", "Club \"Language and Culture\" - ENS", "Cultural diversity", "Club SPORT - ENS", "Club de Recherche et d'Exploration Académique - ENS"];
const AUTH_ERR={"auth/invalid-credential":"Email ou mot de passe incorrect.","auth/invalid-email":"Adresse email invalide.","auth/email-already-in-use":"Un compte existe déjà avec cet email.","auth/weak-password":"Mot de passe : 6 caractères minimum.","auth/too-many-requests":"Trop de tentatives. Réessaie plus tard.","permission-denied":"Action non autorisée."};
const loginScreen=()=>`<h2>Espace présidents</h2><p class="mut">Connecte-toi pour publier un événement et proposer ton aide aux autres clubs. Les événements et les clubs restent consultables sans compte.</p><form class="f box" data-form="login"><label for="em">Email</label><input id="em" type="email" required autocomplete="email"><label for="pw">Mot de passe</label><input id="pw" type="password" required minlength="6" autocomplete="current-password"><button class="btn wide">Se connecter</button><button type="button" class="btn wide" style="background:none;color:var(--blue);border:1.5px solid var(--blue)" data-signup>Créer mon compte</button><p><button type="button" class="link" data-reset>Mot de passe oublié ?</button></p></form>`;
async function authAction(d){const em=($("#em")?.value||"").trim(),pw=$("#pw")?.value||"";try{if(!em)throw"Saisis ton email.";if(d){await sendPasswordResetEmail(auth,em);toast("Email de réinitialisation envoyé.")}else{if(pw.length<6)throw"Mot de passe : 6 caractères minimum.";await createUserWithEmailAndPassword(auth,em,pw)}}catch(x){toast(typeof x==="string"?x:AUTH_ERR[x.code]||"Action impossible. Réessaie.")}}
async function seedClubs(){try{await Promise.all(SEED.map((n,i)=>setDoc(doc(fs,"clubs","c"+String(i+1).padStart(2,"0")),{name:n})));toast("Clubs ajoutés")}catch(x){toast(AUTH_ERR[x.code]||"Ajout impossible.")}}
let auth,fs,db,un=[];
if(ERR.length||!FC.apiKey||/COLLE/.test(FC.apiKey)){$(".tabs").hidden=true;$("#app").innerHTML=`<p class="empty">${E(ERR.join(" ")||"Configuration Firebase manquante : remplis le fichier firebase-config.js (voir README).")}</p>`}
else{const app=initializeApp(FC);auth=getAuth(app);fs=getFirestore(app);
db={collection:n=>({onSnapshot:(f,e)=>onSnapshot(collection(fs,n),f,e),add:d=>addDoc(collection(fs,n),d),doc:id=>({set:d=>setDoc(doc(fs,n,id),d),update:d=>updateDoc(doc(fs,n,id),d),delete:()=>deleteDoc(doc(fs,n,id))})})};
const sub=(k,p)=>db.collection(p).onSnapshot(s=>{S[k]=s.docs.map(d=>({...d.data(),id:d.id}));paint()},()=>{S.err=1;paint()});
S.db=db;sub("clubs","clubs");sub("events","events");render();let pu=()=>{};onAuthStateChanged(auth,u=>{pu();pu=()=>{};S.ready=true;S.me=u?u.uid:null;S.err=0;if(u){const a=sub("props","proposals"),b=sub("needs","needs");pu=()=>{a();b()}}else{S.props=[];S.needs=[];S.help=false}render()})}
</script></body></html>
